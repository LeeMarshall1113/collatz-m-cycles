name: lean

# Manual only: the full m <= 110 build is far larger than the original m <= 101 build and does not
# fit a standard runner's 90-minute timeout (see README, "Checking it").
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
          test: false
          lint: false
      - name: No sorry, native_decide or axiom in the sources
        run: |
          set -euo pipefail
          if grep -rnE '(^|[^`])\bsorry\b|(^|[^`])native_decide|^\s*axiom\b' Collatz Collatz.lean; then
            echo "forbidden construct found" >&2
            exit 1
          fi
      - name: Axiom audit (every Collatz declaration)
        run: lake env lean scripts/AxiomAudit.lean
      - name: Main statement
        run: lake env lean scripts/Statement.lean
